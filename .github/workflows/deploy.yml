name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  APP_DIR: elisa_marcos-wedding
  DIST: elisa_marcos-wedding/dist/elisa_marcos-wedding/browser

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - run: npm ci
        working-directory: ${{ env.APP_DIR }}

      - run: npx ng build --base-href /elisa_marcos-wedding/
        working-directory: ${{ env.APP_DIR }}

      - run: cp ${{ env.DIST }}/index.html ${{ env.DIST }}/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DIST }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
